# SonarQube Cloud analysis configuration.
# Project must be set up on SonarQube Cloud first; SONAR_TOKEN must exist as a
# GitHub secret. When the secret is absent the job is skipped (see ci.yml).

sonar.projectKey=manuc66:TranscribeCppSharp
sonar.organization=manuc66-github

sonar.projectName=TranscribeCppSharp

# C# sources: the hand-written wrapper and the generator. The generated
# Interop P/Invoke surface is re-created by regenerate-bindings.sh and is not
# reviewed by Sonar (it mirrors the upstream Rust FFI).
sonar.sources=src/TranscribeCppSharp,src/Generator
sonar.tests=tests

# Test code is excluded from duplication analysis (CPD), as in the other
# projects of this org.
sonar.cpd.exclusions=**/*Tests.cs

# SonarCloud imports Coverlet coverage in OpenCover format (community doc: "Import
# test coverage reports" for C#).
sonar.cs.opencover.reportsPaths=test-results/coverage.opencover.xml

# Encoding of the source code.
sonar.sourceEncoding=UTF-8
