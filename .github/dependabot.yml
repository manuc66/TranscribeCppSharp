# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Avalonia's packages have to move as one set. The app
    # (src/TranscribeCppSharp.UI), its test host
    # (tests/TranscribeCppSharp.UI.Tests) and the screenshot sample
    # (samples/UIScreenshot) each pin their own Avalonia references, so a
    # per-package update leaves them on different patches and the next restore
    # fails with NU1605 (package downgrade). A single grouped PR keeps them in
    # step. Avalonia.Controls.DataGrid may still land a patch behind the rest;
    # that is fine, its dependency floor is below the shared version.
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
    ignore:
      # Avalonia.Headless.XUnit (12.1.4, the latest) still depends on
      # xunit.v3.extensibility.core 3.2.2. Moving to xunit.v3 4.x makes its
      # discoverer throw MissingMethodException for every [AvaloniaFact] and
      # drops the VSTest target `dotnet test` uses here, which turns the whole
      # UI.Tests project red in CI (this is what 4.0.2 did, PR #25). Lift this
      # together with the pinned version in tests/TranscribeCppSharp.UI.Tests,
      # once Avalonia ships a Headless.XUnit on xunit.v3 4.x.
      - dependency-name: "xunit.v3"
        versions: ["4.x"]

  # The workflow pins every action by commit sha (a tag can be moved), so the
  # pins have to be maintained by something. Grouped: one PR per week for all of
  # them, instead of one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
