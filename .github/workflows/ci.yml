name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      wrapper-version: ${{ steps.version.outputs.wrapper-version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          UPSTREAM=$(cat TRANSCRIBE_VERSION | xargs)
          WRAPPER=$(cat WRAPPER_VERSION | xargs)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            UPSTREAM_VERSION=$UPSTREAM
            WRAPPER_VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            UPSTREAM_VERSION="${UPSTREAM}-preview.${GITHUB_RUN_NUMBER}"
            WRAPPER_VERSION="${WRAPPER}-preview.${GITHUB_RUN_NUMBER}"
          else
            UPSTREAM_VERSION="${UPSTREAM}-dev.${GITHUB_RUN_NUMBER}"
            WRAPPER_VERSION="${WRAPPER}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "wrapper-version=${WRAPPER_VERSION}" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: dotnet restore

      - run: dotnet build --no-restore
      
      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          # Cache only the downloaded binaries, not the .csproj files, so a
          # stale cache never overwrites project changes from the checkout.
          path: native-packages/*/runtimes
          key: native-libs-${{ runner.os }}-${{ hashFiles('tools/FetchNative/Program.cs', 'TRANSCRIBE_VERSION') }}

      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: |
            test-models
            test-audio
          key: test-assets-${{ hashFiles('run-integration-tests.sh') }}

      - name: Fetch native libraries
        run: dotnet run --project tools/FetchNative

      - name: Run tests (including integration)
        run: chmod +x run-integration-tests.sh && ./run-integration-tests.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: test-results/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: test-results/coverage.cobertura.xml
          fail_ci_if_error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify license declarations and attribution
        run: |
          chmod +x tools/license-check.sh
          ./tools/license-check.sh

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ./
          artifact-name: sbom.spdx.json
          format: spdx-json

  check-bindings-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Regenerate bindings and check for drift
        run: |
          chmod +x regenerate-bindings.sh
          ./regenerate-bindings.sh
          if ! git diff --quiet generated/TranscribeCppSharp.Interop/NativeMethods.cs; then
            echo "ERROR: NativeMethods.cs is out of sync with upstream transcribe.cpp"
            echo "Run ./regenerate-bindings.sh and commit the result"
            git diff generated/TranscribeCppSharp.Interop/NativeMethods.cs
            exit 1
          fi

  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - run: dotnet build samples/SmokeTest -c Release

      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          # Cache only the downloaded binaries, not the .csproj files, so a
          # stale cache never overwrites project changes from the checkout.
          path: native-packages/*/runtimes
          key: native-libs-${{ runner.os }}-${{ hashFiles('tools/FetchNative/Program.cs', 'TRANSCRIBE_VERSION') }}

      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: |
            test-models
            test-audio
          key: test-assets-${{ hashFiles('run-integration-tests.sh') }}

      - run: dotnet run --project tools/FetchNative

      - name: Run smoke test
        run: |
          # The model and audio are needed for smoke test too
          mkdir -p test-models test-audio
          [ -f test-models/ggml-tiny.bin ] || curl -fSL -o test-models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          [ -f test-audio/jfk.wav ] || curl -fSL -o test-audio/jfk.wav https://github.com/ggerganov/whisper.cpp/raw/master/samples/jfk.wav
          
          LD_LIBRARY_PATH=native-packages/linux-x64/runtimes/linux-x64/native:$LD_LIBRARY_PATH \
          dotnet run --project samples/SmokeTest -c Release --no-build -- \
          test-models/ggml-tiny.bin test-audio/jfk.wav

  pack-native:
    needs: [build-and-test, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          # Cache only the downloaded binaries, not the .csproj files, so a
          # stale cache never overwrites project changes from the checkout.
          path: native-packages/*/runtimes
          key: native-libs-${{ runner.os }}-${{ hashFiles('tools/FetchNative/Program.cs', 'TRANSCRIBE_VERSION') }}

      - run: dotnet run --project tools/FetchNative -- --all

      - name: Pack native NuGets
        run: |
          for dir in native-packages/win-x64 native-packages/linux-x64 native-packages/linux-arm64 native-packages/osx-arm64 native-packages/osx-x64; do
            dotnet pack "$dir" -c Release -o nupkgs /p:Version=${{ needs.get-version.outputs.version }}
          done

      - uses: actions/upload-artifact@v7
        with:
          name: native-nupkg
          path: nupkgs/*.nupkg

  pack-interop:
    needs: [build-and-test, get-version, pack-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Download native NuGets (local feed for restore)
        uses: actions/download-artifact@v8
        with:
          name: native-nupkg
          path: local-feed

      - name: Pack Interop NuGet
        run: |
          dotnet pack generated/TranscribeCppSharp.Interop -c Release -o nupkgs \
            /p:Version=${{ needs.get-version.outputs.version }} \
            /p:PackNativeRuntimes=true \
            "/p:RestoreAdditionalProjectSources=$(pwd)/local-feed"

      - uses: actions/upload-artifact@v7
        with:
          name: interop-nupkg
          path: nupkgs/*.nupkg

  pack-wrapper:
    needs: [build-and-test, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Pack Wrapper NuGet
        run: |
          dotnet pack src/TranscribeCppSharp -c Release -o nupkgs \
            /p:Version=${{ needs.get-version.outputs.version }} \
            /p:WrapperPackageVersion=${{ needs.get-version.outputs.wrapper-version }}

      - uses: actions/upload-artifact@v7
        with:
          name: wrapper-nupkg
          path: nupkgs/*.nupkg

  push-nugets:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [pack-native, pack-interop, pack-wrapper]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: nupkgs
          pattern: '*-nupkg'
          merge-multiple: true

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet API key (no long-lived secret). Requires a trusted publishing
      # policy on nuget.org (owner manuc66, repo TranscribeCppSharp, workflow
      # ci.yml). The nuget.org profile name is public and not a secret.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: manuc66

      - name: Push all NuGets to nuget.org
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push all NuGets to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/manuc66/index.json" --api-key "$GH_TOKEN" --skip-duplicate

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [push-nugets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: nupkgs
          pattern: '*-nupkg'
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          files: nupkgs/*.nupkg
          generate_release_notes: true
