name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      wrapper-version: ${{ steps.version.outputs.wrapper-version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          UPSTREAM=$(cat build/TRANSCRIBE_VERSION | xargs)
          WRAPPER=$(cat build/WRAPPER_VERSION | xargs)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            UPSTREAM_VERSION=$UPSTREAM
            WRAPPER_VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            UPSTREAM_VERSION="${UPSTREAM}-preview.${GITHUB_RUN_NUMBER}"
            WRAPPER_VERSION="${WRAPPER}-preview.${GITHUB_RUN_NUMBER}"
          else
            UPSTREAM_VERSION="${UPSTREAM}-dev.${GITHUB_RUN_NUMBER}"
            WRAPPER_VERSION="${WRAPPER}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "wrapper-version=${WRAPPER_VERSION}" >> $GITHUB_OUTPUT

  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: dotnet restore

      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          # Cache only the downloaded binaries, not the .csproj files, so a
          # stale cache never overwrites project changes from the checkout.
          path: native-packages/*/runtimes
          key: native-libs-${{ runner.os }}-${{ hashFiles('tools/FetchNative/Program.cs', 'build/TRANSCRIBE_VERSION', 'build/native-sha256.json') }}

      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: |
            test-models
            test-audio
          key: test-assets-${{ matrix.os }}-${{ hashFiles('scripts/run-integration-tests.sh') }}

      # Fetch before build: the build copies the natives into the output dirs
      # (CopyNativeLib in SmokeTest/Tests/Diarize), so it fails on a cold cache
      # if the libs are not there yet.
      - name: Fetch native libraries
        run: dotnet run --project tools/FetchNative

      - run: dotnet build --no-restore

      - name: Run tests (including integration)
        # shell: bash so the same script runs on Windows (Git Bash), macOS and
        # Linux. chmod is a no-op on Windows but harmless.
        # Coverage (collect + 70% threshold) is enforced only on Linux: it is a
        # quality gate for the CI baseline, and the coverage numbers on
        # macOS/Windows (different binaries, platform-specific skips) are not
        # the metric we gate on. Linux-only also avoids the intermittent
        # coverlet "Unable to read beyond the end of the stream" shutdown race
        # on Windows/macOS (coverlet issues #1981/#1983).
        shell: bash
        env:
          COVERLET_COLLECT: ${{ runner.os == 'Linux' && '1' || '0' }}
          COVERLET_THRESHOLD: ${{ runner.os == 'Linux' && '70' || '' }}
        run: chmod +x scripts/run-integration-tests.sh && ./scripts/run-integration-tests.sh

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: test-results/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ runner.os == 'Linux' && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: test-results/coverage.cobertura.xml
          fail_ci_if_error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify license declarations and attribution
        run: |
          chmod +x tools/license-check.sh
          ./tools/license-check.sh

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ./
          artifact-name: sbom.spdx.json
          format: spdx-json

  check-bindings-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Regenerate bindings and check for drift
        run: |
          chmod +x scripts/regenerate-bindings.sh
          ./scripts/regenerate-bindings.sh
          if ! git diff --quiet generated/TranscribeCppSharp.Interop/NativeMethods.cs; then
            echo "ERROR: NativeMethods.cs is out of sync with upstream transcribe.cpp"
            echo "Run ./scripts/regenerate-bindings.sh and commit the result"
            git diff generated/TranscribeCppSharp.Interop/NativeMethods.cs
            exit 1
          fi

  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          # Cache only the downloaded binaries, not the .csproj files, so a
          # stale cache never overwrites project changes from the checkout.
          path: native-packages/*/runtimes
          key: native-libs-${{ runner.os }}-${{ hashFiles('tools/FetchNative/Program.cs', 'build/TRANSCRIBE_VERSION', 'build/native-sha256.json') }}

      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: |
            test-models
            test-audio
          key: test-assets-${{ hashFiles('scripts/run-integration-tests.sh') }}

      - run: dotnet run --project tools/FetchNative

      # Build after FetchNative so the CopyNativeLib target copies the libs
      # into the output dir; the run below uses --no-build.
      - run: dotnet build samples/SmokeTest -c Release

      - name: Run smoke test
        run: |
          # The model and audio are needed for smoke test too
          mkdir -p test-models test-audio
          [ -f test-models/ggml-tiny.bin ] || curl -fSL --proto '=https' --proto-redir '=https' -o test-models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          [ -f test-audio/jfk.wav ] || curl -fSL --proto '=https' --proto-redir '=https' -o test-audio/jfk.wav https://github.com/ggerganov/whisper.cpp/raw/master/samples/jfk.wav
          
          dotnet run --project samples/SmokeTest -c Release --no-build -- \
          test-models/ggml-tiny.bin test-audio/jfk.wav

  pack-native:
    needs: [build-and-test, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          # Cache only the downloaded binaries, not the .csproj files, so a
          # stale cache never overwrites project changes from the checkout.
          path: native-packages/*/runtimes
          key: native-libs-${{ runner.os }}-${{ hashFiles('tools/FetchNative/Program.cs', 'build/TRANSCRIBE_VERSION', 'build/native-sha256.json') }}

      - run: dotnet run --project tools/FetchNative -- --all

      - name: Pack native NuGets
        run: |
          for dir in native-packages/win-x64 native-packages/linux-x64 native-packages/linux-arm64 native-packages/osx-arm64 native-packages/osx-x64; do
            dotnet pack "$dir" -c Release -o nupkgs /p:Version=${{ needs.get-version.outputs.version }}
          done

      - uses: actions/upload-artifact@v7
        with:
          name: native-nupkg
          # Native packages are content-only (no compiled assemblies) and never
          # produce a .snupkg, so only the .nupkg is uploaded here.
          path: nupkgs/*.nupkg

  pack-interop:
    needs: [build-and-test, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Pack Interop NuGet (core, no native runtimes)
        # The Interop package is platform-agnostic: consumers add the native
        # package for their RID, or the TranscribeCppSharp.Bundle meta-package.
        run: |
          dotnet pack generated/TranscribeCppSharp.Interop -c Release -o nupkgs \
            /p:Version=${{ needs.get-version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: interop-nupkg
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg

  pack-wrapper:
    needs: [build-and-test, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Pack Wrapper NuGet
        run: |
          dotnet pack src/TranscribeCppSharp -c Release -o nupkgs \
            /p:Version=${{ needs.get-version.outputs.version }} \
            /p:WrapperPackageVersion=${{ needs.get-version.outputs.wrapper-version }}

      - uses: actions/upload-artifact@v7
        with:
          name: wrapper-nupkg
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg

  pack-bundle:
    # Convenience meta-package: wrapper + every native RID. Depends on both the
    # native and wrapper jobs so their packages exist (the natives come from the
    # local feed produced by pack-native).
    needs: [build-and-test, get-version, pack-native, pack-wrapper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Download native NuGets (local feed for restore)
        uses: actions/download-artifact@v8
        with:
          name: native-nupkg
          path: local-feed

      - name: Pack Bundle meta-package
        run: |
          dotnet pack src/TranscribeCppSharp.Bundle -c Release -o nupkgs \
            /p:Version=${{ needs.get-version.outputs.version }} \
            /p:WrapperPackageVersion=${{ needs.get-version.outputs.wrapper-version }} \
            "/p:RestoreAdditionalProjectSources=$(pwd)/local-feed"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-nupkg
          path: nupkgs/*.nupkg

  pack-tool:
    # .NET tool, RID-specific: `dotnet tool install` picks the package for the
    # user's platform and only that RID's native binaries are embedded. The
    # `any` fallback is framework-dependent and carries no native.
    needs: [build-and-test, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          # Cache only the downloaded binaries, not the .csproj files, so a
          # stale cache never overwrites project changes from the checkout.
          path: native-packages/*/runtimes
          key: native-libs-${{ runner.os }}-${{ hashFiles('tools/FetchNative/Program.cs', 'build/TRANSCRIBE_VERSION', 'build/native-sha256.json') }}

      - name: Fetch native libraries (all RIDs, embedded per RID package)
        run: dotnet run --project tools/FetchNative -- --all

      - name: Pack tool (RID-specific)
        run: |
          dotnet pack src/TranscribeCppSharp.Cli -c Release -o nupkgs \
            /p:Version=${{ needs.get-version.outputs.version }} \
            /p:WrapperPackageVersion=${{ needs.get-version.outputs.wrapper-version }}

      - uses: actions/upload-artifact@v7
        with:
          name: tool-nupkg
          path: nupkgs/*.nupkg

  push-nugets:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [pack-native, pack-interop, pack-wrapper, pack-bundle, pack-tool]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: nupkgs
          pattern: '*-nupkg'
          merge-multiple: true

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet API key (no long-lived secret). Requires a trusted publishing
      # policy on nuget.org (owner manuc66, repo TranscribeCppSharp, workflow
      # ci.yml). The nuget.org profile name is public and not a secret.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: manuc66

      - name: Push all NuGets to nuget.org
        # Push both the package and its symbol package: the glob *.nupkg does not
        # match *.snupkg, so the two must be enumerated separately.
        run: dotnet nuget push "nupkgs/*.nupkg" "nupkgs/*.snupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push all NuGets to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "nupkgs/*.nupkg" "nupkgs/*.snupkg" --source "https://nuget.pkg.github.com/manuc66/index.json" --api-key "$GH_TOKEN" --skip-duplicate

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [push-nugets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: nupkgs
          pattern: '*-nupkg'
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          files: nupkgs/*.nupkg
          generate_release_notes: true
